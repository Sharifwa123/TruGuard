name: Instrumented tests

# Runs the androidTest suite (Room persistence, warning notification, onboarding UI) on an emulator.
# Manual because emulator runs are slow; trigger from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Emulator API level
        default: "34"

permissions:
  contents: read

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          target: google_apis
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report
          path: app/build/reports/androidTests
          if-no-files-found: ignore
